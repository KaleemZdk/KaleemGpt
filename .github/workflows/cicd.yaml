name: KaleemGPT AWS CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

  # Allows you to run the workflow manually
  workflow_dispatch:

# Prevent two deployments from running at the same time
concurrency:
  group: kaleemgpt-production
  cancel-in-progress: true

permissions:
  contents: read

# Shared by every job (available in shell steps as $CONTAINER_NAME / $APP_PORT)
env:
  CONTAINER_NAME: kaleemgpt
  APP_PORT: "8080"

jobs:
  # ============================================================
  # 1. CONTINUOUS INTEGRATION
  # ============================================================
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint code
        run: ruff check . --exit-zero
        # --exit-zero: lint issues are reported but won't fail the build yet.
        # Drop that flag once you want lint failures to block merges.

      - name: Compile-check all Python files
        run: python -m compileall -q .

      - name: Import sanity check
        run: python -c "import app; print('app.py imported OK')"
        # Catches missing packages (fastapi, python-multipart, jinja2...)
        # before the image is built and deployed.

      - name: Run unit tests
        run: |
          if [ -d "tests" ] || compgen -G "test_*.py" > /dev/null || compgen -G "*_test.py" > /dev/null; then
            pytest -v
          else
            echo "No tests found — skipping pytest."
          fi


  # ============================================================
  # 2. BUILD AND PUSH IMAGE TO DOCKER HUB
  # ============================================================
  push_to_registry:
    name: Build and Push Docker Image
    needs: integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker image settings
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
        run: |
          if [ -z "$DOCKER_USERNAME" ]; then
            echo "DOCKER_USERNAME secret is missing."
            exit 1
          fi

          if [ -z "$IMAGE_NAME" ]; then
            echo "IMAGE_NAME secret is missing."
            exit 1
          fi

          echo "Docker image settings are configured."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:main
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ============================================================
  # 3. DEPLOY TO AWS EC2 SELF-HOSTED RUNNER
  # ============================================================
  continuous_deployment:
    name: Deploy to AWS EC2
    needs: push_to_registry
    runs-on: self-hosted

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Validate required secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY secret is missing."
            exit 1
          fi

          echo "All required secrets are configured."

      - name: Check optional secrets
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
          LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
        run: |
          # A missing optional secret only disables the feature that needs it
          # (Groq models, web search, email tool, LangSmith tracing).
          # It does not fail the deploy.
          for name in GROQ_API_KEY TAVILY_API_KEY SMTP_EMAIL SMTP_PASSWORD \
                      LANGSMITH_TRACING LANGSMITH_ENDPOINT LANGSMITH_API_KEY LANGSMITH_PROJECT; do
            if [ -z "${!name}" ]; then
              echo "::warning::$name secret is not set — features that depend on it will not work."
            fi
          done

      - name: Pull latest Docker image
        env:
          IMAGE_PATH: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}
        run: |
          docker pull "${IMAGE_PATH}:main"

      - name: Stop and remove existing container
        run: |
          docker rm -f "$CONTAINER_NAME" 2>/dev/null || true

      - name: Run KaleemGPT container
        env:
          IMAGE_PATH: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
          LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}

        run: |
          docker run -d \
            --restart unless-stopped \
            --name "$CONTAINER_NAME" \
            -p "${APP_PORT}:${APP_PORT}" \
            -v kaleemgpt_data:/app/data \
            -v kaleemgpt_uploads:/app/uploads \
            -e GEMINI_API_KEY \
            -e GROQ_API_KEY \
            -e TAVILY_API_KEY \
            -e SMTP_EMAIL \
            -e SMTP_PASSWORD \
            -e LANGSMITH_TRACING \
            -e LANGSMITH_ENDPOINT \
            -e LANGSMITH_API_KEY \
            -e LANGSMITH_PROJECT \
            "${IMAGE_PATH}:main"
          # kaleemgpt_data    -> /app/data    (chat database, vector index)
          # kaleemgpt_uploads -> /app/uploads (uploaded documents)
          # Named volumes survive redeploys; Docker creates them on first run.
          # Separate names from the old Streamlit project so data never mixes.

      - name: Verify container is running
        run: |
          sleep 10

          if ! docker ps \
            --filter "name=^${CONTAINER_NAME}$" \
            --filter "status=running" \
            --format "{{.Names}}" | grep -q "^${CONTAINER_NAME}$"; then

            echo "The KaleemGPT container failed to start."
            docker logs "$CONTAINER_NAME" || true
            exit 1
          fi

          echo "The KaleemGPT container is running."
          docker ps --filter "name=^${CONTAINER_NAME}$"

      - name: Verify application health
        run: |
          # GET / renders templates/index.html, so this also proves the
          # templates folder made it into the image.
          for attempt in $(seq 1 12); do
            if docker exec "$CONTAINER_NAME" python -c \
              "import urllib.request; urllib.request.urlopen('http://localhost:${APP_PORT}/', timeout=5)" \
              >/dev/null 2>&1; then

              echo "KaleemGPT is healthy."
              exit 0
            fi

            echo "Waiting for the app to become ready..."
            sleep 5
          done

          echo "KaleemGPT did not become healthy."
          docker logs --tail 100 "$CONTAINER_NAME" || true
          exit 1

      - name: Show recent application logs
        if: always()
        run: |
          docker logs --tail 50 "$CONTAINER_NAME" 2>/dev/null || true

      - name: Remove unused Docker images
        if: always()
        run: |
          docker image prune -f